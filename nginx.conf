# Disable directory listing and set the default file
charset utf-8;
autoindex off;
index home.php;

# Block TRACE and TRACK HTTP methods
if ($request_method ~* ^(?:TRACE|TRACK)$) {
    return 403;
}

# Allow public standard files that would otherwise match blocked extensions
location = /robots.txt { try_files $uri =404; }
location = /ads.txt { try_files $uri =404; }
location = /app-ads.txt { try_files $uri =404; }
location = /humans.txt { try_files $uri =404; }
location = /security.txt { try_files $uri =404; }
location = /.well-known/security.txt { try_files $uri =404; }
location = /manifest.json { try_files $uri =404; }
location = /.well-known/assetlinks.json { try_files $uri =404; }
location = /sitemap.xml { try_files $uri =404; }
location = /sitemap_index.xml { try_files $uri =404; }
location = /browserconfig.xml { try_files $uri =404; }

# Block hidden files and directories except .well-known and .public
location ~ (^|/)\.(?!(?:well-known|public)(?:/|$)) {
    return 403;
}

# Block sensitive file extensions
location ~* \.(?:bak|backup|old|orig|save|tmp|temp|swp|swo|rej|dist|sample|log|dump|sql|sqlite|sqlite3|db|ini|conf|cfg|cnf|pem|key|p12|pfx|jks|keystore|inc|phps|sh|rb|lock)$ {
    return 403;
}

# Block TXT files except the exact public files above
location ~* \.txt$ {
    return 403;
}

# Block JSON files except the exact public files above
location ~* \.json$ {
    return 403;
}

# Block XML files except the exact public files above
location ~* \.xml$ {
    return 403;
}

# Block YAML files
location ~* \.(?:yaml|yml)$ {
    return 403;
}

# Block Markdown files
location ~* \.(?:md|markdown)$ {
    return 403;
}

# Block common extensionless development files
location ~* /(?:Dockerfile|Makefile|Vagrantfile|Procfile|Gemfile|Rakefile)$ {
    return 403;
}

# Block editor backup files
location ~ \~$ {
    return 403;
}

# Allow archive packages only inside approved download folders
location ~* ^/(?:downloads|releases|uploads|assets)/.*\.(?:zip|rar|7z|tar|tgz|gz|bz2|xz)$ {
    try_files $uri =404;
}

# Block archive and backup packages everywhere else
location ~* \.(?:zip|rar|7z|tar|tgz|gz|bz2|xz)$ {
    return 403;
}

# Rewrite non-existing files or directories to home.php
location / {
    try_files $uri $uri/ /home.php?uri=$uri&$args;
}

# Custom error pages
#error_page 400 401 403 404 500 502 503 504 /_error.php?e=$status;
error_page 400 401 403 404 500 502 503 504 /spa.php/_error.php?e=$status;

# Prevent MIME sniffing and limit referrer/framing exposure
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;

# Prevent PHP execution when placed inside non-executable folders such as uploads/ or assets/
#location ~* ^/(?:uploads|assets)/.*\.(?:php|phtml|php3|php4|php5|php7|php8)$ {
#    return 403;
#}

# Pass existing PHP scripts to PHP-FPM; adjust fastcgi_pass for your environment
location ~ \.php$ {
    try_files $uri =404;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass 127.0.0.1:9000;
}
