name: CI

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: cd tests && php test_sql.php
      - run: php tests/test_proxy.php
      - run: php tests/test_auth.php
      - run: php tests/test_http.php
      - run: |
          php tests/test_api_respond.php | php -r '$data = json_decode(stream_get_contents(STDIN), true); exit(($data["message"] ?? null) === "ok" ? 0 : 1);'
      - run: node --check _functions.js && node --check _common.js && node --check _spa.js
      - run: node --test tests/common.test.js tests/fragment_scripts.test.js tests/routing.test.js tests/storage.test.js tests/parity.test.js
      - name: Browser contract tests
        run: |
          npm install --prefix "$RUNNER_TEMP/spa-browser" --no-package-lock playwright@1.62.1
          "$RUNNER_TEMP/spa-browser/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/spa-browser/node_modules" node --test tests/browser.test.js
      - run: composer validate --no-check-publish
