name: CI

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: cd __tests__ && php test_sql.php
      - run: php __tests__/test_proxy.php
      - run: php __tests__/test_auth.php
      - run: php __tests__/test_http.php
      - run: |
          php __tests__/test_api_respond.php | php -r '$data = json_decode(stream_get_contents(STDIN), true); exit(($data["message"] ?? null) === "ok" ? 0 : 1);'
      - run: node --check _functions.js && node --check _common.js && node --check _spa.js && node --check _fonts.js
      - run: node --test __tests__/common.test.js __tests__/fragment_scripts.test.js __tests__/routing.test.js __tests__/storage.test.js __tests__/parity.test.js __tests__/fonts.test.js
      - name: Browser contract tests
        run: |
          npm install --prefix "$RUNNER_TEMP/spa-browser" --no-package-lock playwright@1.62.1
          "$RUNNER_TEMP/spa-browser/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/spa-browser/node_modules" node --test __tests__/browser.test.js __tests__/fonts.browser.test.js
      - run: composer validate --no-check-publish
